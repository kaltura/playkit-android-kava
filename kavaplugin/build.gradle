apply plugin: 'com.android.library'
apply from: 'version.gradle'

android {
    namespace 'com.kaltura.playkit.plugin.kava'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionName libVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String","VERSION_NAME","\"${libVersion}\"")
    }
    buildFeatures {
        buildConfig true
    }
    publishing {
        publishing {
            singleVariant('release') {
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    
    implementation 'com.kaltura.netkit:netkit-core:1.3.19'
    implementation 'com.kaltura.playkit:playkit:5.0.6-rc1'
    
    //implementation project(":netkit")
    //implementation project(":playkit")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    implementation 'androidx.annotation:annotation:1.3.0'
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

if (!ext.libVersion.contains('dev')) {
    apply from: './gradle-mvn-push.gradle'
} else {
    apply from: './gradle-mvn-local.gradle'
}
